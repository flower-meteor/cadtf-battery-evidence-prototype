plugins {
    id "com.android.application"
}

android {
    namespace "io.github.flowermeteor.cadtf"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.flowermeteor.cadtf"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
